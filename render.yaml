# =============================================================================
# RENDER DEPLOYMENT CONFIGURATION
# =============================================================================
# IMPORTANT: This file defines the service structure, but API KEYS must be
# manually added in the Render Dashboard!
#
# 🚨 REQUIRED STEPS AFTER DEPLOYING:
# 1. Go to: https://dashboard.render.com
# 2. Select your service → Environment tab
# 3. Manually add these variables (copy from copy_env_for_render.py output):
#    - API_KEY
#    - GOOGLE_API_KEY (and _2, _5, _6, _7, _8, _9, _10)
# 4. Mark all API keys as "Secret" (eye icon)
# 5. Save and redeploy
#
# 📖 Full guide: See RENDER_PRODUCTION_DEPLOYMENT.md
# =============================================================================

services:
  - type: web
    name: ai-agentic-honeypot-system
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      # Python Configuration
      - key: PYTHON_VERSION
        value: 3.13.1
      
      # Required: API Key for authentication
      - key: API_KEY
        sync: false  # Set in Render Dashboard (e.g., honeypot-secret-2026)
      
      # LLM Provider Configuration
      - key: LLM_PROVIDER
        value: gemini  # PRODUCTION: Using Gemini (8 working keys)
      
      # Gemini Configuration - UNLIMITED API Keys Support
      # Add as many keys as needed: GOOGLE_API_KEY, GOOGLE_API_KEY_2, GOOGLE_API_KEY_3, etc.
      - key: GOOGLE_API_KEY
        sync: false  # Set in Render Dashboard (Primary key)
      - key: GOOGLE_API_KEY_2
        sync: false  # Optional: Add in Render Dashboard for key rotation
      - key: GOOGLE_API_KEY_3
        sync: false  # Optional: Add in Render Dashboard
      - key: GOOGLE_API_KEY_4
        sync: false  # Optional: Add in Render Dashboard
      - key: GOOGLE_API_KEY_5
        sync: false  # Optional: Add in Render Dashboard
      - key: GOOGLE_API_KEY_6
        sync: false  # Optional: Add in Render Dashboard
      - key: GOOGLE_API_KEY_7
        sync: false  # Optional: Add in Render Dashboard
      - key: GOOGLE_API_KEY_8
        sync: false  # Optional: Add in Render Dashboard
      - key: GOOGLE_API_KEY_9
        sync: false  # Optional: Add in Render Dashboard
      - key: GOOGLE_API_KEY_10
        sync: false  # Optional: Add in Render Dashboard
      # To add more keys: Go to Render Dashboard → Environment → Add GOOGLE_API_KEY_11, GOOGLE_API_KEY_12, etc.
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      
      # GUVI Callback Configuration
      - key: GUVI_CALLBACK_URL
        value: https://hackathon.guvi.in/api/updateHoneyPotFinalResult
      
      # Performance Configuration - ULTRA-SPEED (Sub-2s Target)
      - key: CACHE_MAX_SIZE
        value: 2000
      - key: LLM_MAX_TOKENS_DETECTION
        value: 350
      - key: LLM_MAX_TOKENS_RESPONSE
        value: 600
      - key: LLM_REQUEST_TIMEOUT
        value: 10
      - key: LLM_TEMPERATURE
        value: 0.7
      - key: ENABLE_FAST_PATH
        value: "true"
      - key: FAST_PATH_THRESHOLD
        value: 3
      
      # Session Configuration
      - key: SESSION_TIMEOUT_MINUTES
        value: 30
      - key: MAX_MESSAGES_PER_SESSION
        value: 50
      
      # Detection Configuration (High Sensitivity for 90+ Score)
      - key: SCAM_SCORE_THRESHOLD
        value: 1
      - key: SCAM_DETECTION_THRESHOLD
        value: 0.4
      
      # Debug Mode (set to true for development)
      - key: INCLUDE_DEBUG_INFO
        value: "false"
